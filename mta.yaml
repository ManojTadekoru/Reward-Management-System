_schema-version: 3.3.0
ID: RewardManagementSystem
description: A simple CAP project.
version: 1.0.0
modules:
- name: RewardManagementSystem-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: RewardManagementSystem-auth
  - name: RewardManagementSystem-db
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: RewardManagementSystem-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: RewardManagementSystem-db
  parameters:
    buildpack: nodejs_buildpack
- name: RewardManagementSystem-destination-content
  type: com.sap.application.content
  requires:
  - name: RewardManagementSystem-destination-service
    parameters:
      content-target: true
  - name: RewardManagementSystem-repo-host
    parameters:
      service-key:
        name: RewardManagementSystem-repo-host-key
  - name: RewardManagementSystem-auth
    parameters:
      service-key:
        name: RewardManagementSystem-auth-key
  parameters:
    content:
      instance:
        destinations:
        - Name: RewardManagementSystem_repo_host
          ServiceInstanceName: RewardManagementSystem-html5-service
          ServiceKeyName: RewardManagementSystem-repo-host-key
          sap.cloud.service: RewardManagementSystem
        - Authentication: OAuth2UserTokenExchange
          Name: RewardManagementSystem_auth
          ServiceInstanceName: RewardManagementSystem-auth
          ServiceKeyName: RewardManagementSystem-auth-key
          sap.cloud.service: RewardManagementSystem
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: RewardManagementSystem-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: RewardManagementSystem-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - comsystemrewardsystem.zip
      name: comsystemrewardsystem
      target-path: resources/
    - artifacts:
      - retailstaff.zip
      name: retailstaff
      target-path: resources/
    - artifacts:
      - customers.zip
      name: customers
      target-path: resources/
- name: comsystemrewardsystem
  type: html5
  path: app/rewardsystem
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: retailstaff
  type: html5
  path: app/retailstaff
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: customers
  type: html5
  path: app/customers
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: RewardManagementSystem-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      tenant-mode: dedicated
      xsappname: RewardManagementSystem-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: RewardManagementSystem-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: RewardManagementSystem-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: RewardManagementSystem-html5-service
    service-plan: app-host
- name: RewardManagementSystem-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: managedrouter-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: RewardManagementSystem-destination-service
    service-plan: lite
  requires:
  - name: srv-api
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
